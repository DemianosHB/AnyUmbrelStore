name: Gluetun VPN
# Packaging-Suffix -pkgN: liefert Packaging-Aenderungen ohne Image-Aenderung
# aus (-pkg1: WebUI-Port 8010->30126; -pkg2: WebUI-Hostname auf den eigenen
# Container-Namen gepinnt).
# (Umbrel erkennt Updates ueber String-Ungleichheit der Version).
# Wichtig: Die renovate-Annotation muss DIREKT ueber version: stehen
# (Regex erlaubt nur Whitespace dazwischen); erfasst nur den Digest
# und laesst den -pkgN-Suffix unberuehrt.
# renovate: datasource=docker depName=ghcr.io/qdm12/gluetun currentValue=latest
version: "sha256:6d21823e204e99adbb0aa811105504514d16150cc5299f443f191c28792fcf4b-pkg2"
tagline: VPN-Client-Container mit eingebautem Web-Interface
description: >-
  Leichter VPN-Client-Container mit Unterstützung für viele Anbieter,
  WireGuard und OpenVPN.


  Wichtig beim ersten Einrichten: VPN-Anbieter, VPN-Typ und
  WireGuard-Schlüssel müssen beim Installieren angegeben werden
  (z. B. VPN_SERVICE_PROVIDER, VPN_TYPE, WIREGUARD_PRIVATE_KEY).


  Die Weboberfläche zeigt Verbindungsstatus, öffentliche IP und
  Server-Infos und erlaubt Start/Stopp aus dem Browser. Der zugehörige
  API-Key ist in Umbrel unter den App-Zugangsdaten sichtbar.


  Für andere Apps erreichbar unter: HTTP-Proxy auf Port 8009,
  SOCKS5-Proxy auf Port 1080, Shadowsocks auf Port 8388.


  Hinweis: Dieses Paket folgt dem Entwicklungs-Kanal (latest) von
  Gluetun, weil der eingebaute SOCKS5-Proxy bisher nur dort und noch
  in keinem Stable-Release enthalten ist.
developer: qdm12
website: https://github.com/passteque/gluetun
dependencies: []
repo: https://github.com/passteque/gluetun
support: https://github.com/passteque/gluetun/issues
releaseNotes: >-
  Packaging-Update -pkg2 (Split-Brain-Sweep): Die WebUI erreicht den
  Gluetun-Container jetzt ueber den eindeutigen Container-Namen
  (anyumbrelstore-gluetun_app_1) statt des bare Service-Namens app -
  Docker DNS lost bare Namen im gemeinsamen Umbrel-Netz je Lookup auch
  auf Container ANDERER Apps auf (hier: AirTrail aus dem offiziellen
  Store mit Service-Namen app auf Port 3000), sodass die WebUI den
  Gluetun-Control-Port 8000 zeitweise nicht erreichte. Gleiches Muster
  wie der Redis-Split-Brain-Fix vom 24.11.2026 (siehe PR #121). Image
  unveraendert (gleicher Digest).

