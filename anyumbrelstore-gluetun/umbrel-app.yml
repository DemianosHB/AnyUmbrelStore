manifestVersion: "1"
id: anyumbrelstore-gluetun
storage:
  dataRoot: data
category: networking
name: Gluetun VPN
# renovate: datasource=docker depName=ghcr.io/qdm12/gluetun currentValue=v3.41.3
version: "3.41.3+patch2"
tagline: VPN-Client-Container mit eingebautem Web-Interface
description: >-
  Leichter VPN-Client-Container mit Unterstützung für viele Anbieter,
  WireGuard und OpenVPN.


  Wichtig beim ersten Einrichten: VPN-Anbieter, VPN-Typ und
  WireGuard-Schlüssel müssen beim Installieren angegeben werden
  (z. B. VPN_SERVICE_PROVIDER, VPN_TYPE, WIREGUARD_PRIVATE_KEY).


  Die Weboberfläche zeigt Verbindungsstatus, öffentliche IP und
  Server-Infos und erlaubt Start/Stopp aus dem Browser. Der zugehörige
  API-Key ist in Umbrel unter den App-Zugangsdaten sichtbar.


  Für andere Apps erreichbar unter: HTTP-Proxy auf Port 8009,
  Shadowsocks auf Port 8388.
developer: qdm12
website: https://github.com/passteque/gluetun
dependencies: []
repo: https://github.com/passteque/gluetun
support: https://github.com/passteque/gluetun/issues
releaseNotes: >-
  Removed the SOCKS5 proxy settings and port 1080: the built-in SOCKS5
  server no longer exists in upstream gluetun (removed well before
  v3.35, the wiki page is stale), so SOCKS5_ENABLED was an unused
  variable and port 1080 listened on nothing. The internal HTTP proxy
  and Shadowsocks remain enabled.
port: 8010
gallery: []
path: ""
defaultUsername: ""
defaultPassword: ""
deterministicPassword: true
submitter: "anyumbrelstore"
submission: "https://github.com/DemianosHB/AnyUmbrelStore/"
icon: https://raw.githubusercontent.com/passteque/gluetun/master/title.svg
