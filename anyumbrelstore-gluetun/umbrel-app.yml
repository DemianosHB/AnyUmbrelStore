manifestVersion: "1"
id: anyumbrelstore-gluetun
storage:
  dataRoot: data
category: networking
name: Gluetun VPN
# renovate: datasource=docker depName=ghcr.io/qdm12/gluetun currentValue=latest
# Packaging-Suffix -pkg1: liefert die Port-Aenderung ohne Image-Aenderung aus
# (Umbrel erkennt Updates ueber String-Ungleichheit der Version; Renovate-
# Regex erfasst weiterhin nur den Digest und laesst den Suffix unberuehrt).
version: "sha256:c2ee4191762fca6b6a3c3359a731198a95d9c9af4db32d466e223bf3a84e779b-pkg1"
tagline: VPN-Client-Container mit eingebautem Web-Interface
description: >-
  Leichter VPN-Client-Container mit Unterstützung für viele Anbieter,
  WireGuard und OpenVPN.


  Wichtig beim ersten Einrichten: VPN-Anbieter, VPN-Typ und
  WireGuard-Schlüssel müssen beim Installieren angegeben werden
  (z. B. VPN_SERVICE_PROVIDER, VPN_TYPE, WIREGUARD_PRIVATE_KEY).


  Die Weboberfläche zeigt Verbindungsstatus, öffentliche IP und
  Server-Infos und erlaubt Start/Stopp aus dem Browser. Der zugehörige
  API-Key ist in Umbrel unter den App-Zugangsdaten sichtbar.


  Für andere Apps erreichbar unter: HTTP-Proxy auf Port 8009,
  SOCKS5-Proxy auf Port 1080, Shadowsocks auf Port 8388.


  Hinweis: Dieses Paket folgt dem Entwicklungs-Kanal (latest) von
  Gluetun, weil der eingebaute SOCKS5-Proxy bisher nur dort und noch
  in keinem Stable-Release enthalten ist.
developer: qdm12
website: https://github.com/passteque/gluetun
dependencies: []
repo: https://github.com/passteque/gluetun
support: https://github.com/passteque/gluetun/issues
releaseNotes: >-
  Automatische(s) Digest-Update(s) (Renovate): ghcr.io/qdm12/gluetun:latest
  sha256:c2ee4191762f → sha256:4af0c8040034.
  Packaging-Update: WebUI-Port von 8010 auf 30126 geaendert, da Port 8010
  mit dem Ryot-Paket (mathieu-ryot) aus einem anderen Community-Store
  kollidiert. Image unveraendert (gleicher Digest, Packaging-Suffix -pkg1).
  HTTP-Proxy (8009), SOCKS5 (1080) und Shadowsocks (8388) bleiben
  unveraendert; AIOStreams/InfiniDysk erreichen Gluetun weiterhin ueber
  den Container-Namen. Die neue WebUI-Adresse ist umbrel.local:30126.
# Wechsel von 8010 auf 30126: Port 8010 kollidiert mit dem Ryot-Paket
# aus mathieuletyrant/umbrel-community-app-store (mathieu-ryot).
port: 30126
