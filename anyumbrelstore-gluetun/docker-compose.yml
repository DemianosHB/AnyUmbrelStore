services:
  app_proxy:
    environment:
      APP_HOST: anyumbrelstore-gluetun_webui_1
      APP_PORT: 3000

  app:
    # Dev-Kanal (master): SOCKS5 existiert hier, aber noch in keinem
    # Stable-Release. Digest-gepinnt, Renovate aktualisiert den Digest.
    image: ghcr.io/qdm12/gluetun:latest@sha256:6d21823e204e99adbb0aa811105504514d16150cc5299f443f191c28792fcf4b
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=${VPN_SERVICE_PROVIDER}
      - VPN_TYPE=${VPN_TYPE}
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - SERVER_COUNTRIES=${SERVER_COUNTRIES}
      - HTTP_CONTROL_SERVER_PORT=8000
      - 'HTTP_CONTROL_SERVER_AUTH_DEFAULT_ROLE={"auth":"apikey","apikey":"${APP_PASSWORD}"}'
      - HTTPPROXY=on
      - SOCKS5_ENABLED=on
      - SHADOWSOCKS=on
    ports:
      - 8009:8888/tcp # HTTP Proxy
      - 1080:1080/tcp # SOCKS5 Proxy
      - 1080:1080/udp # SOCKS5 Proxy (UDP)
      - 8388:8388/tcp # Shadowsocks
      - 8388:8388/udp # Shadowsocks
    volumes:
      - ${APP_DATA_DIR}/data:/gluetun
    restart: always

  webui:
    # Upstream published keine SemVer-Tags (nur main-<sha>): Trackung ueber
    # den beweglichen main-Tag mit Digest-Pin, Renovate aktualisiert den Digest.
    image: scuzza/gluetun-webui:main@sha256:a7c2b4c77f26bb690debe6879cd7149d69710578b13e0dcdc08f6b9b6c7a7a14
    restart: on-failure
    environment:
      - GLUETUN_1_NAME=Gluetun
      # Split-Brain-Fix (Sweep 25.11.2026): Docker-DNS lost bare Service-
      # Namen im gemeinsamen Umbrel-Netz je Lookup auch auf Container
      # ANDERER Apps auf (AirTrail aus dem offiziellen Store nutzt
      # ebenfalls den Service-Namen app) - WebUI deshalb ueber den
      # eigenen Container-Namen adressieren (Konvention wie APP_HOST).
      - GLUETUN_1_URL=http://anyumbrelstore-gluetun_app_1:8000
      - GLUETUN_1_API_KEY=${APP_PASSWORD}
    depends_on:
      - app
