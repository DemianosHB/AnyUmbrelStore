manifestVersion: "1"
id: anyumbrelstore-stremthru
storage:
  dataRoot: data
category: media
name: StremThru
# renovate: datasource=docker depName=muniftanjim/stremthru versioning=semver
version: "0.105.4"
tagline: Debrid-Companion für Stremio und Nuvio (Torz, Store, Stream-Proxy)
description: >-
  StremThru ist ein selbst gehosteter Companion für Stremio und Nuvio: Es
  legt sich als Schicht vor Debrid-Dienste (u. a. TorBox) und stellt eigene
  Stremio-Addons bereit - Torz (Torrent- und Debrid-Suche; ungecachte
  Treffer stoßen einen Download beim Store an und werden nach kurzer
  Wartezeit abspielbar), Store (Katalog des eigenen Debrid-Kontos), Wrap
  und Sidekick. Dazu ein Stream-Proxy mit Byte-Serving.


  Erste Schritte: Dashboard öffnen (umbrel.internal:30128), Login mit admin
  plus dem App-Passwort aus den App-Zugangsdaten. Danach im Dashboard den
  TorBox-API-Key als Store hinterlegen (Vault) und das Torz-Addon
  konfigurieren.


  Anbindung an AIOStreams (optional): Im AIOStreams-Dashboard im Marketplace
  das Addon "StremThru Torz" hinzufügen, als StremThru-URL
  http://umbrel.internal:30128 eintragen und admin plus App-Passwort als
  Credential angeben. Ungecachte Treffer lösen dann einen Download bei
  TorBox aus, statt in Nuvio unabspielbar zu bleiben.


  Hinweis: Die App ist ohne Umbrel-Login im lokalen Netz erreichbar
  (Stremio-Addon-Endpunkte und Player senden keine Umbrel-Cookies);
  StremThru ist über sein eigenes Login geschützt. Nur im lokalen Netz
  bzw. hinter einem VPN betreiben.
releaseNotes: >-
  0.105.4 - Erste Packaging-Version: StremThru 0.105.4 von Docker Hub
  (Semver-Tag, Multi-Arch amd64+arm64; Renovate aktualisiert Manifest-Version
  und Image-Tag gebündelt). Port 30128, Daten in den App-Daten
  (/app/data-Volume), Dashboard-Login admin + App-Passwort (STREMTHRU_AUTH),
  Vault-Secret aus APP_SEED (persistente Speicherung von Store-Tokens),
  TorBox-API ohne Tunnel von der Heim-IP (STREMTHRU_STORE_TUNNEL *=false),
  Healthcheck gegen die Dashboard-Startseite (busybox wget).
developer: MunifTanjim
