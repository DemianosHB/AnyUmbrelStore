services:
  app_proxy:
    environment:
      APP_HOST: anyumbrelstore-stremthru_server_1
      APP_PORT: 8080
      # Umbrel-Login bleibt für das Dashboard aktiv; nur die Endpunkte, die
      # Addon-Clients (AIOStreams) und Player (Nuvio) ohne Umbrel-Cookies
      # anfragen, sind gewhitelisted: Stremio-Addon-Ressourcen (/stremio/*)
      # und Store-/Playback-/Proxy-API (/v0/*, inkl. der 302-Clips für
      # ungecachte Downloads). Beide sind durch StremThrus eigenes Auth
      # geschützt (Credentials im Manifest-Token bzw. Proxy-Authorization).
      PROXY_AUTH_WHITELIST: "/stremio/*,/v0/*"

  server:
    image: muniftanjim/stremthru:0.105.4
    restart: on-failure
    # Nicht-root-Betrieb: Umbrel legt die App-Daten als 1000:1000 an;
    # StremThru (Go-Binary + tini) braucht keine Root-Rechte, nur
    # Schreibzugriff auf /app/data.
    user: "1000:1000"
    volumes:
      - ${APP_DATA_DIR}/data:/app/data
    environment:
      STREMTHRU_PORT: "8080"
      # Base-URL für generierte Addon-/Stream-Links: im Heimnetz und via
      # VPN-Pi-hole aufgelöst (gleiche Zone wie InfiniDysk).
      STREMTHRU_BASE_URL: http://umbrel.internal:30128
      # Dashboard-/Proxy-Login: admin + App-Passwort (deterministicPassword).
      STREMTHRU_AUTH: admin:${APP_PASSWORD}
      STREMTHRU_AUTH_ADMIN: admin
      # Vault-Secret (verschlüsselte Ablage von Store-Tokens im
      # Dashboard); APP_SEED ist stabil pro App-Installation.
      STREMTHRU_VAULT_SECRET: ${APP_SEED}
      # TorBox-API direkt von der Heim-IP (TorBox blockiert keine
      # Heim-IPs); Tunnel optional möglich über STREMTHRU_HTTP_PROXY
      # (z. B. Gluetun HTTP-Proxy).
      STREMTHRU_STORE_TUNNEL: "*:false"
      # RAM-/Disk-Deckel gegen den Vorfall vom 04.11.2026 (Box-Freeze
      # nach StremThru-Installation: 4,5 GB RAM-Peak + 27 GB Disk-Writes
      # in 2 h, Userspace tot bis Stromcycle): StremThru peert ohne das
      # Flag lazy EAGER mit der öffentlichen Instanz (stremthru.13377001.xyz,
      # Dockerdefault von STREMTHRU_PEER_URI, base64-kodiert im Upstream-
      # Code) und zieht bei jedem suchenden IMDb-ID blockierend Torrent-
      # Infos in die lokale SQLite (sqlite://./data/stremthru.db).
      # lazy = Pulls laufen queued im Hintergrund statt synchron-bulk;
      # no_spill_torz = Torrent-File-Listen nicht zurück an den Peer pushen.
      STREMTHRU_PEER_FLAG: "lazy,no_spill_torz"
      # Disk-backed Torz-Torrentfile-Cache (Upstream-Default 256MB) klein halten.
      STREMTHRU_TORZ_TORRENT_FILE_CACHE_SIZE: 64MB
      # Go-Runtime früh GCen lassen: Heap-Deckel deutlich unter dem
      # cgroup-mem_limit, damit der GC läuft, bevor der Kernel in den
      # Memory-Pressure-Livelock geht.
      GOMEMLIMIT: 1GiB
    # Container stirbt notfalls allein (OOM-Restart über restart: on-failure)
    # und zieht die 16-GB-Box nicht mehr in einen Reclaim-Livelock.
    mem_limit: 1500m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/"]
      interval: 30s
      retries: 3
      start_period: 30s
