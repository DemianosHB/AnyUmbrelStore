services:
  app_proxy:
    environment:
      APP_HOST: anyumbrelstore-profilearr_server_1
      APP_PORT: 6868

  server:
    image: ghcr.io/dictionarry-hub/profilarr:2.3.1
    restart: on-failure
    volumes:
      - ${APP_DATA_DIR}/data:/config
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Europe/Berlin
      # Split-Brain-Fix (Sweep 25.11.2026): bare Service-Namen koennen im
      # gemeinsamen Umbrel-Netz auf Container anderer Apps aufgeloest werden
      # - Parser ueber den eigenen Container-Namen adressieren (gleiche
      # Konvention wie APP_HOST).
      PARSER_HOST: anyumbrelstore-profilearr_parser_1
      PARSER_PORT: "5000"
    depends_on:
      parser:
        condition: service_healthy

  parser:
    image: ghcr.io/dictionarry-hub/profilarr-parser:2.3.1
    restart: on-failure
