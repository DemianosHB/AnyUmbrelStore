services:
  app_proxy:
    environment:
      APP_HOST: anyumbrelstore-profilarr_server_1
      APP_PORT: 6868

  server:
    image: ghcr.io/dictionarry-hub/profilarr:2.2.0
    restart: on-failure
    volumes:
      - ${APP_DATA_DIR}/data:/config
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Europe/Berlin
      PARSER_HOST: parser
      PARSER_PORT: "5000"
    depends_on:
      parser:
        condition: service_healthy

  parser:
    image: ghcr.io/dictionarry-hub/profilarr-parser:2.2.0
    restart: on-failure
