manifestVersion: "1"
id: anyumbrelstore-profilearr
storage:
  dataRoot: data
category: media
name: Profilarr
# renovate: datasource=docker depName=ghcr.io/dictionarry-hub/profilarr versioning=semver
version: "2.3.0"
tagline: Qualitätsprofile für Radarr und Sonarr verwalten
description: >-
  Profilarr hilft dir, Qualitätsprofile und Custom Formats für Radarr
  und Sonarr zu erstellen, zu testen und mit deinen Instanzen zu
  synchronisieren. Der zusätzliche Parser ermöglicht Tests von
  Custom Formats und Qualitätsprofilen.
developer: Dictionarry-Hub
website: https://dictionarry.dev
dependencies: []
repo: https://github.com/Dictionarry-Hub/profilarr
support: https://github.com/Dictionarry-Hub/profilarr/issues
releaseNotes: >-
  Added an app icon, storage.dataRoot for umbrelOS 2.0 external
  drives, and aligned the manifest with the umbrel packaging
  conventions. Version suffix +patch1 marks this packaging update.
port: 6868
gallery: []
path: ""
defaultUsername: ""
defaultPassword: ""
submitter: "anyumbrelstore"
submission: "https://github.com/DemianosHB/AnyUmbrelStore/"
icon: https://raw.githubusercontent.com/DemianosHB/AnyUmbrelStore/master/anyumbrelstore-profilearr/icon.svg
