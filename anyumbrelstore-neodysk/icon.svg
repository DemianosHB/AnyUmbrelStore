<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="NeoDysk">
  <!-- NeoDysk: sharp hexagon ring + slim N + data stack, blue-to-green gradient -->
  <defs>
    <linearGradient id="neodysk-g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="neodysk-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <!-- subtle outer glow ring -->
  <polygon points="256,20 462,139 462,377 256,496 50,377 50,139" fill="none" stroke="url(#neodysk-glow)" stroke-width="10" stroke-linejoin="miter" opacity="0.25"/>
  <!-- sharp hexagon ring -->
  <polygon points="256,40 445,149 445,367 256,476 67,367 67,149" fill="none" stroke="url(#neodysk-g)" stroke-width="26" stroke-linejoin="miter"/>
  <!-- slim N -->
  <path d="M198 348 V164 L314 348 V164" fill="none" stroke="url(#neodysk-g)" stroke-width="22" stroke-linecap="round" stroke-linejoin="miter"/>
  <!-- data stack -->
  <rect x="176" y="382" width="160" height="10" rx="5" fill="url(#neodysk-g)"/>
  <rect x="196" y="400" width="120" height="10" rx="5" fill="url(#neodysk-g)" opacity="0.85"/>
  <rect x="216" y="418" width="80" height="10" rx="5" fill="url(#neodysk-g)" opacity="0.7"/>
</svg>
