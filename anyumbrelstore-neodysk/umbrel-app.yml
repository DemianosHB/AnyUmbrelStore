manifestVersion: "1"
id: anyumbrelstore-neodysk
storage:
  dataRoot: data
category: media
name: NeoDysk
version: "2.0.0-beta.11-Demianos1"
tagline: Usenet-Streaming über WebDAV/FUSE (Rust-V2-Fork), parallel zur V1-App installierbar
description: >-
  NeoDysk (Rust-Neubau aus DemianosHB/infinidysk, Branch rust) mountet
  Usenet-Inhalte als virtuelles Dateisystem (WebDAV und FUSE) und streamt
  sie direkt, ohne sie komplett herunterladen zu müssen. Enthält eine
  SABnzbd-kompatible API, Indexer-Search inkl. Prowlarr-Sync, Suchprofile
  und Stremio-Addon-Routen.

  Diese App installiert NeoDysk MIT EIGENEM, LEEREM Datenverzeichnis parallel
  zur bestehenden V1-App (InfiniDysk, Port 30125). Beide Apps laufen
  unabhängig nebeneinander.

  Pre-Release zum Testen: Der Container kann beim Erststart optional eine
  1.x-Installation aus /config importieren - für einen sauberen Test zunächst
  NICHT die V1-Config einbinden, sondern mit leerem /config starten und
  die 1.x-Config nur für einen separaten Import-Test auf einer Kopie nutzen.

  Erste Schritte: Weboberfläche öffnen und beim Erststart einen Admin-Account
  anlegen. Usenet-Provider (Newznab-Indexer, NNTP-Server) und WebDAV-Zugangsdaten
  in den Einstellungen hinterlegen. INFINIDYSK__*-Umgebungsvariablen können
  Einstellungen vorab provisionieren (ENV-Präfix bleibt technisch bedingt
  beim alten Namen, siehe Rebranding-PR DemianosHB/infinidysk#32).

  Anbindung an AIOStreams (optional): NeoDysk im AIOStreams-Dashboard als
  NzbDAV-Service hinzufügen - URL http://anyumbrelstore-neodysk_server_1:3000,
  API-Key und WebDAV-Credentials aus den NeoDysk-Einstellungen, Public URL
  leer lassen und den AIOStreams-Auth-Token setzen.

  Hinweis: Ohne Umbrel-Login im lokalen Netz erreichbar (WebDAV- und
  SABnzbd-Clients senden keine Umbrel-Cookies); NeoDysk ist über sein
  eigenes Login geschützt. Nur im lokalen Netz bzw. hinter einem VPN
  betreiben.
releaseNotes: >-
  2.0.0-beta.11-Demianos1 - Erste Pre-Release des Forks (Rust 2.x, Branch rust,
  Commit ae4d4cd, Upstream-Vendoring 89db517 inkl. beta.12-Fixes). Portierte
  v1-Features: Indexer-Search + Prowlarr-Sync, Suchprofile, Stremio-Addon-Routen,
  Watchtower/Watchdog/Preflight/Warden, Read-ahead-Repair, INFINIDYSK__*-Env-
  Provisioning, Watchtower-Identity-Guard-Fix (PR #14). Plus STRM-Handoff-umask-Fix
  (fork PR #27, upstream infinidysk#1969). Rebranding des Forks zu NeoDysk läuft
  (PR DemianosHB/infinidysk#32); Repo- und Image-Name bleiben infinidysk, das
  ENV-Präfix INFINIDYSK__ bleibt aus Kompatibilitätsgründen. Image:
  ghcr.io/demianoshb/infinidysk-rust:v2.0.0-beta.11-Demianos1 (multi-arch
  amd64/arm64). Pre-Release, nicht für Produktion.
