category: media
name: NeoDysk
version: "2-beta.04"
tagline: Usenet-Streaming über WebDAV/FUSE (Rust-V2-Fork), parallel zur V1-App installierbar
description: >-
  NeoDysk (Rust-Neubau aus DemianosHB/neodysk, vormals infinidysk, Branch rust) mountet
  Usenet-Inhalte als virtuelles Dateisystem (WebDAV und FUSE) und streamt
  sie direkt, ohne sie komplett herunterladen zu müssen. Enthält eine
  SABnzbd-kompatible API, Indexer-Search inkl. Prowlarr-Sync, Suchprofile
  und Stremio-Addon-Routen.

  Diese App installiert NeoDysk MIT EIGENEM, LEEREM Datenverzeichnis parallel
  zur bestehenden V1-App (InfiniDysk, Port 30125). Beide Apps laufen
  unabhängig nebeneinander.

  Pre-Release zum Testen: Der Container kann beim Erststart optional eine
  1.x-Installation aus /config importieren - für einen sauberen Test zunächst
  NICHT die V1-Config einbinden, sondern mit leerem /config starten und
  die 1.x-Config nur für einen separaten Import-Test auf einer Kopie nutzen.

  Erste Schritte: Weboberfläche öffnen und beim Erststart einen Admin-Account
  anlegen. Usenet-Provider (Newznab-Indexer, NNTP-Server) und WebDAV-Zugangsdaten
  in den Einstellungen hinterlegen. INFINIDYSK__*-Umgebungsvariablen können
  Einstellungen vorab provisionieren (ENV-Präfix bleibt technisch bedingt
  beim alten Namen, siehe Rebranding-PR DemianosHB/neodysk#32).

  Anbindung an AIOStreams (optional): NeoDysk im AIOStreams-Dashboard als
  NzbDAV-Service hinzufügen - URL http://anyumbrelstore-neodysk_server_1:3000,
  API-Key und WebDAV-Credentials aus den NeoDysk-Einstellungen, Public URL
  leer lassen und den AIOStreams-Auth-Token setzen.

  Hinweis: Ohne Umbrel-Login im lokalen Netz erreichbar (WebDAV- und
  SABnzbd-Clients senden keine Umbrel-Cookies); NeoDysk ist über sein
  eigenes Login geschützt. Nur im lokalen Netz bzw. hinter einem VPN
  betreiben.
releaseNotes: >-
  2-beta.04 - Fork-Release (rust @ 8a82682, Tag v2-beta.04): UI: fetch setzt den
  Form-Content-Type fuer URLSearchParams-Bodies selbst, statt ihn manuell mit zu
  setzen (#47). Search: Newznab-Protokollfehler und Indexer-Config-Fehler werden
  jetzt auch auf der Search-Page geloggt - jede bekannte per-Indexer-Fehlmeldung von
  /api/search-indexers ist dort sichtbar (#48). Indexer: XML-Entity- und
  Zeichenreferenzen werden aufgeloest, Prowlarr-Feeds parsen damit wieder (#49).
  Image: ghcr.io/demianoshb/neodysk-rust:v2-beta.04 (multi-arch amd64/arm64, auch
  latest). Pre-Release, nicht fuer Produktion.
  2-beta.03 - Fork-Release (rust @ 48aa287a, Tag v2-beta.03; neues v2-beta.NN-Schema laut
  rust/README.md): Fork-Seiten laden im Local-Mode ohne Login - watchtower, watchdog, search,
  warden und prowlarr-status gaten jetzt wie die Admin-Routen ueber Auth::exempt;
  LAN-Clients ohne Session-Cookie sehen die Seiten statt 401 (neodysk#42). Suchprofile
  nach dem Anlegen editierbar: Edit-Sheet mit Name, Indexer-Auswahl, Quality-Sort,
  bevorzugten Audiosprachen (geordneter Sprach-Bias) und Movie/TV-Query-Fallback (neodysk#40).
  Watchtower-URL-Listen: JSON-Antworten mit list-Envelope werden geparsed, Accept-Header
  wird gesendet, und HTTP-Fehler (z. B. 415) erscheinen mit Status in der Meldung
  (neodysk#44). Indexer-Suchfehler erscheinen mit Klartext im Log - invalides XML meldet
  HTTP-Status, Content-Type, Groesse und Byte-Offset, ohne URLs oder API-Keys zu leaken
  (neodysk#45). AioStreams laedt das Stremio-Addon-Manifest wieder - die /adapters-Routen
  lieferten durch die SPA-Fallback-Middleware HTML statt JSON (neodysk#46). Wordmark zeigt
  neodysk statt infinidysk (neodysk#41). Docs: Release-Schema v2-beta.NN dokumentiert
  (neodysk#39). Image: ghcr.io/demianoshb/neodysk-rust:v2-beta.03 (multi-arch amd64/arm64,
  auch latest). Pre-Release, nicht fuer Produktion.
  v2.0.0-beta.11-Demianos2 - Commits: chore(ci): add rust dependency audit workflow;
  fix(deps): update webpki-root-certs 1.0.9 -> 1.0.12 for RUSTSEC-2026-0383; ci(docker):
  build arm64 natively on an ARM runner, share the build cache across refs; Merge pull
  request #28 from DemianosHB/vibe/rust-deps-audit-d80f40; Merge pull request #29 from
  DemianosHB/vibe/rust-docker-native-arm-96d353; chore(ci): auto-delete PR head branches
  after merge into rust; chore(ci): build the rust docker image only on v2* tags; Merge
  pull request #30 from DemianosHB/vibe/rust-auto-delete-d80f40 …
  2.0.0-beta.11-Demianos2 - Fork-Release (rust @ 4124c95): Rebranding zu NeoDysk
  abgeschlossen - Repo heisst jetzt DemianosHB/neodysk, neues N-Mark-Logo, UI-Strings,
  und das Image liegt ab sofort unter ghcr.io/demianoshb/neodysk-rust (Demianos1
  hiess es noch infinidysk-rust). Settings: SOCKS5-Outbound-Proxy jetzt per UI in
  Settings -> Network konfigurierbar (proxy.socks5, proxy.socks5_bypass, PR #34),
  vorher nur per INFINIDYSK__*-ENV-Provisioning. Neue Settings-Kategorien unter
  "v1 fork": Repairs (Read-Ahead-PAR2-Fenster), Search, Preflight, Playback (play.*),
  Stall-Failover (grab.*) - PR #38. Fix: Profil-Anlegen schickt wieder die
  PascalCase-Enum-Werte des Backends (422 Unprocessable Entity beim Profil
  hinzufuegen behoben, PR #37). Deps: webpki-root-certs 1.0.12
  (RUSTSEC-2026-0383). Image: ghcr.io/demianoshb/neodysk-rust:v2.0.0-beta.11-Demianos2
  (multi-arch amd64/arm64, auch latest). Pre-Release, nicht fuer Produktion.
  2.0.0-beta.11-Demianos1 - Erste Pre-Release des Forks (Rust 2.x, Branch rust,
  Commit ae4d4cd, Upstream-Vendoring 89db517 inkl. beta.12-Fixes). Portierte
  v1-Features: Indexer-Search + Prowlarr-Sync, Suchprofile, Stremio-Addon-Routen,
  Watchtower/Watchdog/Preflight/Warden, Read-ahead-Repair, INFINIDYSK__*-Env-
  Provisioning, Watchtower-Identity-Guard-Fix (PR #14). Plus STRM-Handoff-umask-Fix
  (fork PR #27, upstream infinidysk#1969). Rebranding des Forks zu NeoDysk läuft
  (PR DemianosHB/neodysk#32); Repo- und Image-Name bleiben infinidysk, das
  ENV-Präfix INFINIDYSK__ bleibt aus Kompatibilitätsgründen. Image:
  ghcr.io/demianoshb/infinidysk-rust:v2.0.0-beta.11-Demianos1 (multi-arch
  amd64/arm64). Pre-Release, nicht für Produktion.
