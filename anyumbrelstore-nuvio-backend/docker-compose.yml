# Nuvio backend (NuvioMedia/self-host) packaged as a native Umbrel app.
#
# Design: no docker.sock, no docker compose exec.
#   nuvio-fetch    one-shot: clones the pinned upstream revision into
#                  app-data, generates secrets on first start and writes
#                  ${APP_DATA_DIR}/data/nuvio.env (upstream .env plus a
#                  generated section of mapped service variables).
#   nuvio-migrate  one-shot: applies database/migrations idempotently and
#                  configures instance settings via psql over the network
#                  (replicates ./nuvio migrate + configure_instance).
#   nuvio-seed     one-shot: uploads avatar assets into Storage (idempotent).
#   db, kong, auth, rest, storage, imgproxy, functions, account-dashboard:
#                  the upstream default service set. Upstream profile-gated
#                  services (studio, meta, realtime) and supavisor (only
#                  needed by studio) are intentionally not included.
#
# The maintenance scripts live in hooks/ (mounted read-only): umbrelOS
# re-copies only compose, templates, exports.sh, tornc and hooks/ on app
# updates, never data/ - so script fixes reach existing installs.
#
# Bind-mount policy: umbreld pre-creates every bind-mount source path
# with mkdir -p before each install/update attempt, so only directories
# are mounted from app-data. Single-file mounts would make every install
# retry and every app update fail with EEXIST once nuvio-fetch has
# checked out real files. The runtime tree (data/runtime/{db-init,kong})
# is rebuilt by nuvio-fetch on every app start; db-init is side-mounted
# at /nuvio-init and copied into the image's /docker-entrypoint-initdb.d
# by the db entrypoint (mounting it over initdb.d would shadow the
# image's built-in init scripts). The hooks/*.sh mounts are files
# umbreld owns and re-copies itself, so they are safe.
#
# Ports:
#   app_proxy -> account-dashboard:8080 (Account-Dashboard, manifest port 30122)
#   kong 30123:8000 (Backend-URL for Nuvio clients: http://<device>:30123)
#
# Runtime configuration comes from env_file (generated by nuvio-fetch);
# ${...} compose interpolation is not available for generated secrets.

services:
  app_proxy:
    environment:
      APP_HOST: anyumbrelstore-nuvio-backend_account-dashboard_1
      APP_PORT: 8080

  nuvio-fetch:
    image: docker.io/library/alpine:3.24
    restart: "no"
    environment:
      # Upstream publishes no releases/tags; pin the revision here.
      # Update together with the app version in umbrel-app.yml.
      NUVIO_SELFHOST_PINNED_COMMIT: 30f156807ae77b2aec80b091b0d513841a25ab91
      # Umbrel device context (interpolated at compose time); the fetch
      # script falls back to umbrel.local when these are unset.
      NUVIO_BACKEND_URL: "http://${DEVICE_DOMAIN_NAME}:30123"
      NUVIO_DASHBOARD_URL: "http://${DEVICE_DOMAIN_NAME}:${APP_PROXY_PORT}"
      DEVICE_HOSTNAME: "${DEVICE_DOMAIN_NAME}"
    volumes:
      - ${APP_DATA_DIR}/data:/app-data
      - ${APP_DATA_DIR}/hooks/nuvio-fetch.sh:/scripts/nuvio-fetch.sh:ro
    entrypoint:
      - /bin/sh
      - -c
      - apk add --no-cache git openssl && exec sh /scripts/nuvio-fetch.sh

  db:
    image: docker.io/supabase/postgres:17.6.1.084
    restart: unless-stopped
    env_file: ${APP_DATA_DIR}/data/nuvio.env
    environment:
      POSTGRES_HOST: /var/run/postgresql
    # nuvio-fetch's runtime tree is side-mounted at /nuvio-init and copied
    # into the image's /docker-entrypoint-initdb.d on every container start.
    # Mounting it over /docker-entrypoint-initdb.d would shadow the image's
    # built-in init scripts (roles, auth/storage schemas, extensions) -
    # upstream only overrides single files and keeps the rest intact.
    entrypoint:
      - /bin/sh
      - -c
      - mkdir -p /docker-entrypoint-initdb.d/migrations /docker-entrypoint-initdb.d/init-scripts && cp -f /nuvio-init/migrations/*.sql /docker-entrypoint-initdb.d/migrations/ && cp -f /nuvio-init/init-scripts/*.sql /docker-entrypoint-initdb.d/init-scripts/ && exec docker-entrypoint.sh "$@"
      - --
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - log_min_messages=fatal
    volumes:
      # Directory mount only (umbreld pre-creates bind-mount sources with
      # mkdir -p before every install/update attempt - single-file mounts
      # would fail with EEXIST after the first checkout). nuvio-fetch
      # rebuilds this tree on every app start; the layout matches the
      # upstream initdb.d structure exactly:
      #   migrations/: 97-_supabase.sql, 99-logs.sql, 99-pooler.sql,
      #     99-realtime.sql, 99999999990000-nuvio-baseline.sql,
      #     99999999990001-nuvio-auth-trigger.sql
      #   init-scripts/: 98-webhooks.sql, 99-roles.sql, 99-jwt.sql
      # Side-mounted at /nuvio-init (umbreld-safe directory mount); the
      # entrypoint copies the files into the image's initdb.d, keeping the
      # image's built-in init scripts intact - the same net effect as
      # upstream's single-file overrides:
      #   migrations/: 97-_supabase.sql, 99-logs.sql, 99-pooler.sql,
      #     99-realtime.sql, 99999999990000-nuvio-baseline.sql,
      #     99999999990001-nuvio-auth-trigger.sql
      #   init-scripts/: 98-webhooks.sql, 99-roles.sql, 99-jwt.sql
      - ${APP_DATA_DIR}/data/runtime/db-init:/nuvio-init:ro,Z
      - ${APP_DATA_DIR}/data/self-host/volumes/db/data:/var/lib/postgresql/data:Z
      - db-config:/etc/postgresql-custom
    depends_on:
      nuvio-fetch:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
        "CMD-SHELL",
        "pg_isready -U postgres -h localhost && psql -U supabase_admin -d \"$${POSTGRES_DB}\" -Atqc \"select exists(select 1 from nuvio_migrations.schema_migrations where version = '00000000000000')\" | grep -qx t"
        ]
      # First initdb applies the full Supabase init plus the Nuvio
      # baseline dump (minutes on Umbrel-class hardware); probes failing
      # during start_period do not count. Warm starts report healthy on
      # the first probe. Worst case wait: 300s + 60 x 10s = 15 min.
      # NOTE: the db log shows harmless "FATAL: role \"postgres\" does not
      # exist" noise from pg_isready - the supabase image uses supabase_admin
      # as its superuser (POSTGRES_USER=supabase_admin). Upstream produces the
      # same noise; the healthcheck passes anyway.
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 300s

  nuvio-migrate:
    image: docker.io/supabase/postgres:17.6.1.084
    restart: "no"
    env_file: ${APP_DATA_DIR}/data/nuvio.env
    volumes:
      - ${APP_DATA_DIR}/data/self-host/database/migrations:/migrations:ro
      - ${APP_DATA_DIR}/hooks/nuvio-migrate.sh:/scripts/nuvio-migrate.sh:ro
    entrypoint:
      - /bin/sh
      - /scripts/nuvio-migrate.sh
    depends_on:
      db:
        condition: service_healthy

  kong:
    image: docker.io/kong/kong:3.9.1
    restart: unless-stopped
    env_file: ${APP_DATA_DIR}/data/nuvio.env
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /usr/local/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_DNS_NOT_FOUND_TTL: "1"
      KONG_PLUGINS: request-transformer,cors,key-auth,acl,basic-auth,request-termination,post-function
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: "64 160k"
      KONG_PROXY_ACCESS_LOG: /dev/stdout combined
      NUVIO_GATEWAY_CONFIG_VERSION: "discovery-v1"
    entrypoint:
      - /bin/sh
      - /home/kong/kong-entrypoint.sh
    ports:
      - 30123:8000/tcp # Backend-URL für Nuvio-Clients (http://umbrel.local:30123)
    volumes:
      # Directory mount only (rebuilt by nuvio-fetch: kong/temp.yml +
      # kong/kong-entrypoint.sh). The upstream entrypoint hard-codes
      # /home/kong/temp.yml and /home/kong is empty in the kong image, so
      # mounting the whole directory is safe.
      - ${APP_DATA_DIR}/data/runtime/kong:/home/kong:ro,Z
    depends_on:
      nuvio-fetch:
        condition: service_completed_successfully
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth:
    image: docker.io/supabase/gotrue:v2.189.0
    restart: unless-stopped
    env_file: ${APP_DATA_DIR}/data/nuvio.env
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    depends_on:
      nuvio-fetch:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:9999/health"
        ]
      timeout: 5s
      interval: 5s
      retries: 3
    volumes:
      - ${APP_DATA_DIR}/data/self-host/volumes/auth/templates:/etc/gotrue/templates:ro,z

  rest:
    image: docker.io/postgrest/postgrest:v14.12
    restart: unless-stopped
    env_file: ${APP_DATA_DIR}/data/nuvio.env
    depends_on:
      nuvio-fetch:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "postgrest", "--ready"]
      interval: 5s
      timeout: 5s
      retries: 3
    command:
      - postgrest

  storage:
    image: docker.io/supabase/storage-api:v1.60.4
    restart: unless-stopped
    env_file: ${APP_DATA_DIR}/data/nuvio.env
    depends_on:
      nuvio-fetch:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      rest:
        condition: service_started
      imgproxy:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://storage:5000/status"
        ]
      timeout: 5s
      interval: 5s
      retries: 3
      start_period: 10s
    volumes:
      - storage-data:/var/lib/storage

  imgproxy:
    image: docker.io/darthsim/imgproxy:v3.30.1
    restart: unless-stopped
    env_file: ${APP_DATA_DIR}/data/nuvio.env
    volumes:
      - storage-data:/var/lib/storage
    healthcheck:
      test:
        [
          "CMD",
          "imgproxy",
          "health"
        ]
      timeout: 5s
      interval: 5s
      retries: 3

  functions:
    image: docker.io/supabase/edge-runtime:v1.74.0
    restart: unless-stopped
    env_file: ${APP_DATA_DIR}/data/nuvio.env
    volumes:
      - ${APP_DATA_DIR}/data/self-host/volumes/functions:/home/deno/functions:z
      - deno-cache:/root/.cache/deno
    depends_on:
      nuvio-fetch:
        condition: service_completed_successfully
      kong:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/127.0.0.1/9000'"]
      interval: 5s
      timeout: 5s
      retries: 3
    command:
      - start
      - --main-service
      - /home/deno/functions/main

  account-dashboard:
    # Upstream publishes no semver tags (only :latest and sha-<commit>).
    # Pinned via immutable sha tag + digest; bump together with the pinned
    # upstream commit in nuvio-fetch when updating.
    image: ghcr.io/nuviomedia/nuvio-account-dashboard:sha-76e8e4f76d348b563aa5851ade856dda94234449@sha256:6b6976985906df71bb8603422e7e199d309d60f8114481e959838ce00cb29013
    restart: unless-stopped
    env_file: ${APP_DATA_DIR}/data/nuvio.env
    depends_on:
      nuvio-fetch:
        condition: service_completed_successfully
      kong:
        condition: service_healthy

  nuvio-seed:
    image: docker.io/curlimages/curl:8.23.0
    restart: "no"
    env_file: ${APP_DATA_DIR}/data/nuvio.env
    volumes:
      - ${APP_DATA_DIR}/data:/app-data
      - ${APP_DATA_DIR}/hooks/nuvio-seed.sh:/scripts/nuvio-seed.sh:ro
    entrypoint:
      - /bin/sh
      - /scripts/nuvio-seed.sh
    depends_on:
      nuvio-fetch:
        condition: service_completed_successfully
      kong:
        condition: service_healthy
      storage:
        condition: service_healthy

volumes:
  db-config:
  deno-cache:
  storage-data:
