manifestVersion: "1"
id: anyumbrelstore-nuvio-backend
storage:
  dataRoot: data
category: media
name: Nuvio Backend
# Packaging-Version dieser App. Upstream (NuvioMedia/self-host) published keine
# Releases; der gepinnte Upstream-Commit steht in docker-compose.yml (nuvio-fetch).
version: "0.1.2"
tagline: Selbst gehostetes Nuvio-Backend mit Account-Dashboard
description: >-
  Nuvio als eigenständiges Backend für eigene Nuvio-Clients. Nach der
  Installation im Account-Dashboard (http://umbrel.local:30122) zuerst einen
  Account anlegen; Nuvio-Clients verbinden sich dann mit der Backend-URL
  http://umbrel.local:30123. Enthält das Account-Dashboard zur
  Kontoverwaltung sowie den API-Stack aus NuvioMedia/self-host
  (PostgreSQL, GoTrue-Auth, PostgREST, Storage, Edge Functions,
  Kong-Gateway). Das Upstream-Repo wird als gepinnter Commit nach app-data
  geklont, Secrets werden beim ersten Start automatisch generiert.
developer: NuvioMedia
website: https://nuvio.tv
dependencies: []
repo: https://github.com/NuvioMedia/self-host
support: https://github.com/NuvioMedia/self-host/issues
releaseNotes: >-
  0.1.2 - Fix für hängende Erstinstallation: der db-Init wurde in 0.1.1
  mit einem Verzeichnis-Mount über /docker-entrypoint-initdb.d versehentlich
  über die eingebauten Init-Skripte des supabase/postgres-Images gelegt
  (Rollen- und Schema-Anlage fehlten, die Nuvio-Baseline brach ab, die DB
  wurde nie healthy). nuvio-init wird jetzt seitlich nach /nuvio-init
  gemountet und vom db-Entrypoint in das initdb.d des Images kopiert -
  die Image-Skripte laufen wieder wie upstream. 0.1.1 - Fix für
  fehlgeschlagene Erstinstallation: alle Einzel-Datei-Mounts
  durch Verzeichnis-Mounts ersetzt, da umbreld Mount-Quellpfade vor jedem
  Install-/Update-Versuch als Verzeichnisse anlegt (EEXIST-Fehler bei jedem
  Wiederholungsversuch und jedem App-Update); DB-Healthcheck-Fenster für die
  Erstinitialisierung (initdb mit Supabase- und Nuvio-Baseline) auf bis zu
  15 Minuten erweitert; Runtime-Baum (db-init, kong) wird von nuvio-fetch
  bei jedem App-Start neu aufgebaut. 0.1.0 - Erste Packaging-Version. Klon
  von NuvioMedia/self-host (Commit
  30f1568) per nuvio-fetch One-Shot-Service, Supabase-Stack im
  Upstream-Default-Profil (ohne Studio, Realtime und Supavisor),
  automatische Secret-Generierung beim ersten Start mit Backup gegen
  App-Updates, idempotente DB-Migrationen per nuvio-migrate,
  Avatar-Seeding per nuvio-seed. Dashboard via app_proxy (Port 30122),
  Backend-API (Kong) auf Host-Port 30123.
port: 30122
gallery: []
path: ""
backupIgnore:
  - data/self-host/.git/*
  - data/runtime/*
defaultUsername: ""
defaultPassword: ""
submitter: "anyumbrelstore"
submission: "https://github.com/DemianosHB/AnyUmbrelStore/"
icon: https://raw.githubusercontent.com/DemianosHB/AnyUmbrelStore/master/anyumbrelstore-nuvio-backend/icon.svg
