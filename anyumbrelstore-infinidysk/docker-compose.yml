services:
  app_proxy:
    environment:
      APP_HOST: anyumbrelstore-infinidysk_server_1
      APP_PORT: 3000
      # WebDAV- und SABnzbd-Clients (z. B. AIOStreams als NzbDAV-Service)
      # senden keine Umbrel-Login-Cookies; InfiniDysk bringt ein eigenes
      # Login mit (Admin-Account wird beim Erststart im Web-UI angelegt).
      PROXY_AUTH_ADD: "false"

  server:
    # Eigener Fork-Build (DemianosHB/infinidysk): Upstream-1.x plus
    # Preferred audio languages (infinidysk/infinidysk#1765) und globaler
    # SOCKS5-Outbound-Proxy inkl. Bypass-Ausnahmen (v1.7.1-lang4/lang5).
    # Upstream 1.x ist feature-frozen;
    # Fork-Releases kommen als vX.Y.Z-langN-Tags.
    # Renovate bumpt Image + Manifest-Version gebündelt (Annotation in
    # umbrel-app.yml, benannte extractVersion-Gruppe).
    image: ghcr.io/demianoshb/infinidysk:v1.7.1-lang5
    restart: on-failure
    volumes:
      - ${APP_DATA_DIR}/data:/config
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Europe/Berlin
    healthcheck:
      test: ["CMD", "curl", "-fsSL", "http://localhost:3000/healthz"]
      interval: 30s
      retries: 3
      start_period: 60s
