category: media
name: InfiniDysk
# renovate: datasource=docker depName=ghcr.io/demianoshb/infinidysk extractVersion=^v?(?<version>.*)$ versioning=semver
version: "1.7.1-lang4"
tagline: Usenet-Streaming über ein virtuelles WebDAV-Laufwerk
description: >-
  InfiniDysk (NzbDAV SuperFork) mountet Usenet-Inhalte als virtuelles
  WebDAV-Laufwerk und streamt sie direkt, ohne sie komplett herunterladen
  zu müssen: NZB-Dateien werden on-the-fly entpackt und als Dateien über
  WebDAV bereitgestellt. Enthält außerdem eine SABnzbd-kompatible API.


  Erste Schritte: Weboberfläche öffnen und beim Erststart einen Admin-Account
  anlegen. Danach Usenet-Provider (Newznab-Indexer und NNTP-Server) sowie
  WebDAV-Zugangsdaten in den Einstellungen hinterlegen.


  Anbindung an AIOStreams (optional): InfiniDysk im AIOStreams-Dashboard als
  NzbDAV-Service hinzufügen - URL http://anyumbrelstore-infinidysk_server_1:3000,
  API-Key und WebDAV-Credentials aus den InfiniDysk-Einstellungen, Public URL
  leer lassen und den AIOStreams-Auth-Token setzen. AIOStreams proxied die
  Streams dann für alle Player, sodass Usenet-Inhalte direkt in Nuvio/Stremio
  abspielbar sind.


  Hinweis: Die App ist ohne Umbrel-Login im lokalen Netz erreichbar (WebDAV-
  und SABnzbd-Clients senden keine Umbrel-Cookies); InfiniDysk ist über sein
  eigenes Login geschützt. Nur im lokalen Netz bzw. hinter einem VPN betreiben.
releaseNotes: >-
  v1.7.1-lang4 - Fork-Update (Fork-PRs #3/#4): Prozessweiter SOCKS5-Outbound-Proxy
  (general.socks5-proxy in Settings -> General inkl. "Test proxy"-Button;
  tunnelt NNTP- und HTTP-Verbindungen, z. B. ueber den Gluetun-SOCKS5-Proxy
  auf Port 1080; DNS remote, TLS Ende-zu-Ende, Loopback und einzelne
  Docker-Namen bleiben direkt, per-Indexer-Proxy-Einstellungen haben
  Vorrang, Standard aus) sowie Settings-UI fuer die bevorzugten
  Audio-Sprachen (Settings -> Profiles -> "Preferred audio languages",
  geordnete Liste z. B. de, en; Bias, kein Filter).
  v1.7.1-lang3 - Watchdog-Failover-Sortierung im Fork: Der
  Play-Failover des Watchdogs (ProfilePlayController, Fork-PR #2,
  Commit 0e957d0) folgt nicht mehr blind der von AIOStreams
  gemeldeten Reihenfolge, sondern reiht die Fallback-Kandidaten
  nach den Profil-Einstellungen neu: zuerst Sprache
  (PreferredAudioLanguages), dann Aufloesung und Quelle
  (QualitySort: ResolutionAndSource), dann Subtitle-Bias und
  Client-Reihenfolge. Das angeklickte Release bleibt Position 1,
  fremdsprachige Releases werden nie entfernt, nur herabgestuft
  (fail-open); ohne Profil-Einstellungen bleibt das Verhalten
  exakt wie vorher. Fork: github.com/DemianosHB/infinidysk
  (Branch v1), Release v1.7.1-lang3. Zukünftige Fork-Updates
  erscheinen als vX.Y.Z-langN-Tags; Renovate bumpt Image und
  Manifest-Version gebündelt (Annotation mit benannter
  extractVersion-Gruppe).
