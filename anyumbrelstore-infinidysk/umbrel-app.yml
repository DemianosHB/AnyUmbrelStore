manifestVersion: "1"
id: anyumbrelstore-infinidysk
storage:
  dataRoot: data
category: media
name: InfiniDysk
# renovate: datasource=docker depName=ghcr.io/demianoshb/infinidysk extractVersion=^v?(?<version>.*)$ versioning=semver
version: "1.7.1-lang1"
tagline: Usenet-Streaming über ein virtuelles WebDAV-Laufwerk
description: >-
  InfiniDysk (NzbDAV SuperFork) mountet Usenet-Inhalte als virtuelles
  WebDAV-Laufwerk und streamt sie direkt, ohne sie komplett herunterladen
  zu müssen: NZB-Dateien werden on-the-fly entpackt und als Dateien über
  WebDAV bereitgestellt. Enthält außerdem eine SABnzbd-kompatible API.


  Erste Schritte: Weboberfläche öffnen und beim Erststart einen Admin-Account
  anlegen. Danach Usenet-Provider (Newznab-Indexer und NNTP-Server) sowie
  WebDAV-Zugangsdaten in den Einstellungen hinterlegen.


  Anbindung an AIOStreams (optional): InfiniDysk im AIOStreams-Dashboard als
  NzbDAV-Service hinzufügen - URL http://anyumbrelstore-infinidysk_server_1:3000,
  API-Key und WebDAV-Credentials aus den InfiniDysk-Einstellungen, Public URL
  leer lassen und den AIOStreams-Auth-Token setzen. AIOStreams proxied die
  Streams dann für alle Player, sodass Usenet-Inhalte direkt in Nuvio/Stremio
  abspielbar sind.


  Hinweis: Die App ist ohne Umbrel-Login im lokalen Netz erreichbar (WebDAV-
  und SABnzbd-Clients senden keine Umbrel-Cookies); InfiniDysk ist über sein
  eigenes Login geschützt. Nur im lokalen Netz bzw. hinter einem VPN betreiben.
releaseNotes: >-
  v1.7.1-lang1 - Erster Build aus dem eigenen Fork ghcr.io/demianoshb/infinidysk
  (Basis: Upstream v1.7.1) mit Preferred audio languages
  (infinidysk/infinidysk#1765): Das neue Profil-Setting
  PreferredAudioLanguages (z. B. ["de","en"]) sortiert Suchkandidaten nach
  Sprach-Rang, damit Preflight/Watchtower/Watchdog bevorzugt
  deutschsprachige Releases verifizieren. Fork:
  github.com/DemianosHB/infinidysk (Branch v1), Release v1.7.1-lang1.
  Zukünftige Fork-Updates erscheinen als vX.Y.Z-langN-Tags; Renovate bumpt
  Image und Manifest-Version gebündelt (Annotation mit benannter
  extractVersion-Gruppe, Lektion PR #72).
