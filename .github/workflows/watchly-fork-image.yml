name: Watchly Fork Image

on:
  workflow_dispatch:
    inputs:
      watchly_ref:
        description: "Branch, Tag oder Commit im Watchly-Fork, der gebaut wird"
        required: true
        default: "release/all-features"
      image_tag:
        description: "Docker-Tag fuer ghcr.io/demianoshb/watchly"
        required: true
        default: "1.18.1-Demianos2"

concurrency:
  group: watchly-fork-image
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Checkout Watchly fork
        uses: actions/checkout@v5
        with:
          repository: DemianosHB/Watchly
          ref: ${{ inputs.watchly_ref }}
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push multi-arch image
        run: |
          IMAGE="ghcr.io/demianoshb/watchly"
          TAG="${{ inputs.image_tag }}"
          echo "Building ${IMAGE}:${TAG} from ${{ inputs.watchly_ref }}"
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -t "${IMAGE}:${TAG}" \
            -t "${IMAGE}:latest" \
            --push \
            .
