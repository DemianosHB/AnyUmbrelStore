name: Watchly Docker Image

on:
  push:
    branches:
      - master
    paths:
      - "docker/watchly/**"
      - ".github/workflows/watchly-image.yml"
  workflow_dispatch:
    inputs:
      watchly_ref:
        description: "Watchly upstream tag to build (e.g. 1.17.3)"
        required: false
        default: ""

# Repo-Ebene nur Lesezugriff; Package-Push-Rechte nur am Job (siehe unten).
permissions:
  contents: read

concurrency:
  group: watchly-image
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # Default upstream tag to build; bump here to release a new image tag.
      # renovate: datasource=github-releases depName=TimilsinaBimal/Watchly extractVersion=^v?
      WATCHLY_REF: ${{ inputs.watchly_ref || '1.17.2' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lowercase repository owner for GHCR
        id: owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tag
        id: version
        run: |
          VERSION="${WATCHLY_REF#v}"
          if [ -z "$VERSION" ]; then
            echo "Could not resolve WATCHLY_REF" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker/watchly
          platforms: linux/amd64,linux/arm64
          push: true
          # Attestierungen: Provenienz (signierter Build-Nachweis) + SBOM
          # (Zutatenliste) landen als Attestation am Image auf GHCR.
          provenance: true
          sbom: true
          build-args: |
            WATCHLY_REF=${{ env.WATCHLY_REF }}
          tags: |
            ghcr.io/${{ steps.owner.outputs.owner }}/watchly:latest
            ghcr.io/${{ steps.owner.outputs.owner }}/watchly:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
