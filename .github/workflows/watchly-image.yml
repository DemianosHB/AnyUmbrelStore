name: Watchly Docker Image

on:
  push:
    branches:
      - master
    paths:
      - "docker/watchly/**"
      - ".github/workflows/watchly-image.yml"
  workflow_dispatch:
    inputs:
      watchly_ref:
        description: "Watchly upstream tag to build (e.g. 1.17.3)"
        required: false
        default: ""

concurrency:
  group: watchly-image
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # Default upstream tag to build; bump here to release a new image tag.
      WATCHLY_REF: ${{ inputs.watchly_ref || '1.17.2' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Lowercase repository owner for GHCR
        id: owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tag
        id: version
        run: |
          VERSION="${WATCHLY_REF#v}"
          if [ -z "$VERSION" ]; then
            echo "Could not resolve WATCHLY_REF" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: docker/watchly
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            WATCHLY_REF=${{ env.WATCHLY_REF }}
          tags: |
            ghcr.io/${{ steps.owner.outputs.owner }}/watchly:latest
            ghcr.io/${{ steps.owner.outputs.owner }}/watchly:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
