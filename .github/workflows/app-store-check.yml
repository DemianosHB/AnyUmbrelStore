name: App Store Check

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

# contents: write wird für den Commit-Step benötigt, der die Changelog- und
# README-Aktualisierungen auf den PR-Branch pusht (Fork-PRs scheitern dort
# harmlos mit einer Warnung - die Änderungen stehen dann nur im PR-Kommentar).
permissions:
  contents: write
  pull-requests: write

jobs:
  check-packages:
    name: Validate app packages
    runs-on: ubuntu-latest
    steps:
      # HEAD des PRs statt des Merge-Refs auschecken, damit der Commit-Step
      # auf den PR-Branch pushen kann; fetch-depth 0 für die Base-SHA-Vergleiche.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Clone official Umbrel App Store (port reference)
        run: git clone --depth 1 https://github.com/getumbrel/umbrel-apps.git /tmp/umbrel-apps

      - name: List changed files in this PR
        if: github.event_name == 'pull_request'
        run: git diff --name-only ${{ github.event.pull_request.base.sha }}..HEAD || true

      # Die Check-Skripte (check-apps.py, pr-changelog.py, pr-report.js) sind
      # Teil der Check-Logik des Base-Branches – der Workflow selbst läuft
      # bei pull_request-Events über den Merge-Ref (= Version des Base-
      # Branches). Der Job checkt aber head.sha aus (siehe oben), und PR-
      # Branches, die älter sind als Skript-Änderungen (z. B. bestehende
      # Renovate-Branches), haben dort veraltete oder fehlende Skripte: Der
      # Changelog-Sync lief dann still leer durch. Die Skripte werden daher
      # vom Base-Branch nach /tmp/ci-scripts geladen – außerhalb des
      # Workspaces, damit der Commit-Step sie nicht mit in den PR committet.
      # Nur wenn der Base-Branch ein Skript nicht (mehr) enthält, fällt der
      # Job auf die Version im PR-Checkout zurück.
      - name: Fetch CI scripts from the base branch
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin "${{ github.event.pull_request.base.ref }}"
          mkdir -p /tmp/ci-scripts
          ok=1
          for f in check-apps.py pr-changelog.py pr-report.js; do
            if git show "FETCH_HEAD:scripts/$f" > "/tmp/ci-scripts/$f" 2>/dev/null; then
              echo "scripts/$f: Version vom Base-Branch '${{ github.event.pull_request.base.ref }}' geladen."
            elif [ -f "scripts/$f" ]; then
              cp "scripts/$f" "/tmp/ci-scripts/$f"
              echo "::warning::scripts/$f fehlt auf dem Base-Branch - nutze die Version aus dem PR-Branch."
            else
              echo "::error::scripts/$f weder im Base-Branch noch im PR-Branch gefunden."
              ok=0
            fi
          done
          [ "$ok" = 1 ]

      # Schritt 1 des Checks: Was hat sich mit dem neuen Tag geändert?
      # Vergleicht die docker-compose.yml der betroffenen Apps zwischen
      # Base-SHA und HEAD (alte vs. neue Image-Tags/Digests), ruft die
      # Upstream-Release-Notes zwischen altem und neuem Tag ab (Compare-API
      # als Fallback) und schreibt daraus einen Changelog-Eintrag in die
      # releaseNotes der umbrel-app.yml sowie die neue Manifest-Version in
      # die Versions-Tabelle des READMEs. Es wird nur der Workspace geändert;
      # gepusht wird erst nach bestandenem Package-Check (Commit-Step), damit
      # die Checks in demselben Lauf die aktualisierten Dateien validieren.
      # pipefail: Bricht der Sync ab, fällt der Step jetzt hörbar auf -
      # zuvor verschluckte die Pipe an tee den Exit-Code von Python und der
      # Step lief mit leerer Ausgabe "erfolgreich" durch.
      - name: Detect new tags, sync changelog & README
        id: changelog
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          python /tmp/ci-scripts/pr-changelog.py \
            --root "$PWD" \
            --base-sha "${{ github.event.pull_request.base.sha }}" | tee /tmp/changelog-output.txt
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run package checks
        id: checks
        run: |
          set +e
          CHECK_APPS="scripts/check-apps.py"
          if [ -f /tmp/ci-scripts/check-apps.py ]; then
            CHECK_APPS="/tmp/ci-scripts/check-apps.py"
          fi
          python "$CHECK_APPS" \
            --root "$PWD" \
            --repo "${{ github.repository }}" \
            --official /tmp/umbrel-apps \
            --base-sha "${{ github.event.pull_request.base.sha }}" | tee /tmp/check-output.txt
          status=${PIPESTATUS[0]}
          set -e
          cat /tmp/changelog-output.txt >> /tmp/check-output.txt || true
          exit $status

      # Changelog-/README-Änderungen aus dem Sync-Schritt als Commit auf den
      # PR-Branch bringen - nur wenn alle Checks grün sind. Pushes mit dem
      # GITHUB_TOKEN lösen keine neuen Workflow-Runs aus; die aktualisierten
      # Dateien wurden in diesem Lauf bereits validiert, da der Sync-Schritt
      # vor dem Package-Check läuft. Bei Fork-PRs scheitert der Push (Token
      # darf nicht ins Fork-Repo pushen) und wird nur als Warnung gemeldet -
      # die Änderungen stehen dann trotzdem im PR-Kommentar.
      - name: Commit changelog & README updates to the PR branch
        if: >-
          github.event_name == 'pull_request' &&
          steps.checks.outcome == 'success' &&
          steps.changelog.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "chore: Changelog & README für neue Tags synchronisiert"
          if ! git push origin HEAD:"${{ github.event.pull_request.head.ref }}"; then
            echo "::warning::Push auf den PR-Branch fehlgeschlagen (z. B. Fork-PR). Die Changelog-/README-Änderungen stehen nur im PR-Kommentar und müssen manuell übernommen werden."
            exit 0
          fi

      # Ergebnis des Checks als aufbereiteter Kommentar am PR (Ergebnistabelle
      # pro App, Begründungen für erwartete Warnungen, Tag-Änderungen &
      # Changelog-Sync, einklappbares Log). Ein bestehender Bot-Kommentar
      # wird aktualisiert statt neu angelegt; die Aufbereitung liegt in
      # scripts/pr-report.js (geladen vom Base-Branch, siehe Fetch-Step).
      - name: Report results on the PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v9
        env:
          OUTCOME: ${{ steps.checks.outcome }}
          REPORT_FILE: /tmp/check-output.txt
          REPORT_KIND: app-store-check
        with:
          script: return require('/tmp/ci-scripts/pr-report.js')({ github, context, core });
