name: App Store Check

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  check-packages:
    name: Validate app packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Clone official Umbrel App Store (port reference)
        run: git clone --depth 1 https://github.com/getumbrel/umbrel-apps.git /tmp/umbrel-apps

      - name: List changed files in this PR
        if: github.event_name == 'pull_request'
        run: git diff --name-only ${{ github.event.pull_request.base.sha }}..HEAD || true

      - name: Run package checks
        id: checks
        run: |
          python scripts/check-apps.py \
            --repo "${{ github.repository }}" \
            --official /tmp/umbrel-apps \
            --base-sha "${{ github.event.pull_request.base.sha }}" | tee /tmp/check-output.txt

      # Ergebnis des Checks als Kommentar am PR ablegen; ein bestehender
      # Bot-Kommentar wird aktualisiert statt bei jedem Push neu angelegt.
      - name: Report results on the PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v9
        env:
          OUTCOME: ${{ steps.checks.outcome }}
        with:
          script: |
            const fs = require('fs');
            let out = '';
            try { out = fs.readFileSync('/tmp/check-output.txt', 'utf8').trim(); } catch (e) {}
            const outcome = process.env.OUTCOME || 'unknown';
            const marker = '<!-- app-store-check-report -->';
            const title = outcome === 'success'
              ? '✅ App Store Check: bestanden'
              : '❌ App Store Check: fehlgeschlagen';
            const code = out
              ? out.split('\n').map((l) => '    ' + l).join('\n')
              : '    (keine Ausgabe)';
            const body = marker + '\n\n## ' + title + '\n\n' + code + '\n';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => (c.body || '').includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: body,
              });
              core.info('Kommentar aktualisiert: ' + existing.html_url);
            } else {
              const { data: created } = await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
              core.info('Kommentar erstellt: ' + created.html_url);
            }
