name: Upstream Changelog Watch

on:
  schedule:
    # montags 06:00 UTC (08:00 Berlin im Sommer, 07:00 im Winter)
    - cron: "0 6 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/check-upstream.py"
      - "scripts/pr-report.js"
      - ".github/workflows/upstream-watch.yml"

permissions:
  # Repo-Ebene nur Lesezugriff; Schreibrechte (Issues/Kommentare) nur am Job.
  contents: read

# Bei schnellen Push-Folgen nur den neuesten Lauf rechnen.
concurrency:
  group: upstream-watch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  upstream-watch:
    name: Check upstream releases and changelogs
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      # Checkout vor der lokalen Composite Action (braucht ausgechecktes Workspace).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Python setup
        uses: ./.github/actions/setup

      # Kein eigener API-Key nötig: secrets.GITHUB_TOKEN wird pro Lauf
      # automatisch bereitgestellt und über den permissions-Block auf
      # Lesen + Issue-Anlegen begrenzt.
      - name: Run upstream checks
        id: checks
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/check-upstream.py \
            --report-file /tmp/upstream-report.md | tee /tmp/upstream-output.txt

      # Ergebnis auch als Kommentar am PR (PR-Testläufe erzeugen kein Issue);
      # Aufbereitung wie beim App Store Check in scripts/pr-report.js.
      - name: Report results on the PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          OUTCOME: ${{ steps.checks.outcome }}
          REPORT_FILE: /tmp/upstream-output.txt
          REPORT_KIND: upstream-watch
        with:
          script: return require('./scripts/pr-report.js')({ github, context, core })

      # Bei schedule/workflow_dispatch: Report als Issue veröffentlichen
      # (vorhandenes Watch-Issue aktualisieren statt verdoppeln; bei
      # Entwarnung wieder schließen). Bei Pull-Requests nur Ausgabe im Log.
      - name: Publish report as issue
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          REPORT: /tmp/upstream-report.md
        run: |
          set -eu
          API="https://api.github.com/repos/$REPO/issues"
          AUTH="Authorization: Bearer $GITHUB_TOKEN"
          ACCEPT="Accept: application/vnd.github+json"
          MARKER="[upstream-watch]"
          EXISTING=$(curl -sf -H "$AUTH" -H "$ACCEPT" "$API?state=open&per_page=100" \
            | jq -r --arg m "$MARKER" '.[] | select(.title | startswith($m)) | .number' \
            | head -1 || true)
          if [ -s "$REPORT" ]; then
            BODY=$(jq -Rs . < "$REPORT")
            TITLE="$MARKER Upstream-Report: Handlungsbedarf prüfen"
            if [ -n "$EXISTING" ]; then
              curl -sf -X PATCH -H "$AUTH" -H "$ACCEPT" \
                -d "{\"title\": \"$TITLE\", \"body\": $BODY}" "$API/$EXISTING" > /dev/null
              echo "Issue #$EXISTING aktualisiert."
            else
              curl -sf -X POST -H "$AUTH" -H "$ACCEPT" \
                -d "{\"title\": \"$TITLE\", \"body\": $BODY}" "$API" > /dev/null
              echo "Neues Watch-Issue erstellt."
            fi
          elif [ -n "$EXISTING" ]; then
            curl -sf -X PATCH -H "$AUTH" -H "$ACCEPT" \
              -d '{"state": "closed", "state_reason": "completed"}' "$API/$EXISTING" > /dev/null
            echo "Issue #$EXISTING geschlossen (alles ruhig)."
          else
            echo "Keine Befunde und kein offenes Watch-Issue - nichts zu tun."
          fi
