manifestVersion: "1"
id: anyumbrelstore-paperless-backup
storage:
  dataRoot: data
category: files
name: Paperless Backup
# renovate: datasource=docker depName=duplicati/duplicati
version: "2.4.1.0"
tagline: Duplicati-Backup der Paperless-Daten inkl. DB-Dump auf die Hetzner Storage Box
description: >-
  Eine App, zwei Container: dbdump sichert die
  Paperless-PostgreSQL-Datenbank taeglich um 01:30 (Europe/Berlin) per
  pg_dump|gzip in die App-Daten (db-export, 7 Tagesversionen); Duplicati
  (offizielles Container-Image) sichert taeglich die Dokumente (media/)
  und die DB-Dumps per SFTP mit Passwort-Auth (Port 22, keine SSH-Keys)
  auf die Storage Box. Der Backup-Job wird ueber die gewohnte
  Duplicati-Weboberflaeche eingerichtet und wiederhergestellt. Kein Fork
  und keine Modifikation der offiziellen Paperless-App: media wird nur
  lesend gemountet. Ersetzt die eigenstaendige App
  anyumbrelstore-paperless-dbdump.
developer: DemianosHB
website: https://github.com/DemianosHB/AnyUmbrelStore
dependencies: []
repo: https://github.com/DemianosHB/AnyUmbrelStore
support: https://github.com/DemianosHB/AnyUmbrelStore/issues
releaseNotes: "2.4.1.0 - About this release This release builds on version 2.4.0.1 with a large number of bug fixes, and adds three new features: incremental (delta) backups of Microsoft 365 and Google Workspace, and restore tests that can run after backups and be switched on remotely from the console. The local database format is updated by this release. See \"Downgrading\" below before going back to an earlier version. Delta walk for Microsoft 365 and Google Workspace Microsoft 365 and Google Workspace backups no longer need to list every item on every run. … 1.1.2 - Re-Release des Permission-Fixes aus 1.1.1 (Duplicati laeuft als root statt UID 1000, behebt den Crash beim Start wegen root-owned /data). Grund: 1.1.1 wurde auf dem Zielsystem bereits als installierte Version registriert, und Umbrel bietet bei identischer Versionsnummer kein Update an. dbdump bleibt postgres:18. 1.1.1 - Fix fuer Crash beim Start: Duplicati laeuft als root (Image-Default), da UID 1000 auf die root-owned App-Daten (/data) keinen Schreibzugriff hatte (Permission denied). dbdump-Image auf postgres:18 angehoben (pg_dump-Client 18 ist fuer PostgreSQL-16-Server zulaessig)."
port: 39120
