manifestVersion: "1"
id: anyumbrelstore-paperless-backup
storage:
  dataRoot: data
category: files
name: Paperless Backup
version: "1.1.1"
tagline: Duplicati-Backup der Paperless-Daten inkl. DB-Dump auf die Hetzner Storage Box
description: >-
  Eine App, zwei Container: dbdump sichert die
  Paperless-PostgreSQL-Datenbank taeglich um 01:30 (Europe/Berlin) per
  pg_dump|gzip in die App-Daten (db-export, 7 Tagesversionen); Duplicati
  (offizielles Container-Image) sichert taeglich die Dokumente (media/)
  und die DB-Dumps per SFTP mit Passwort-Auth (Port 22, keine SSH-Keys)
  auf die Storage Box. Der Backup-Job wird ueber die gewohnte
  Duplicati-Weboberflaeche eingerichtet und wiederhergestellt. Kein Fork
  und keine Modifikation der offiziellen Paperless-App: media wird nur
  lesend gemountet. Ersetzt die eigenstaendige App
  anyumbrelstore-paperless-dbdump.
developer: DemianosHB
website: https://github.com/DemianosHB/AnyUmbrelStore
dependencies: []
repo: https://github.com/DemianosHB/AnyUmbrelStore
support: https://github.com/DemianosHB/AnyUmbrelStore/issues
releaseNotes: "1.1.1 - Fix fuer Crash beim Start. Duplicati laeuft wieder als root (Image-Default), da UID 1000 auf die root-owned App-Daten (/data) keinen Schreibzugriff hatte (Permission denied). Backup-Quellen bleiben nur lesend gemountet. dbdump-Image auf postgres:18 angehoben (pg_dump-Client 18 ist fuer PostgreSQL-16-Server zulaessig). 1.1.0 - Backup-Engine von Borgmatic auf Duplicati (offizielles Image, digest-gepinnt) umgestellt: SFTP Port 22 mit Passwort-Auth statt SSH-Keys, Web-UI fuer Job-Einrichtung und Restore. dbdump-Service unveraendert (taeglich 01:30, 7 Tagesversionen)."
port: 39120
gallery: []
path: ""
defaultUsername: ""
defaultPassword: ""
deterministicPassword: true
submitter: anyumbrelstore
submission: https://github.com/DemianosHB/AnyUmbrelStore/
icon: https://raw.githubusercontent.com/DemianosHB/AnyUmbrelStore/master/anyumbrelstore-paperless-backup/icon.svg
