version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: anyumbrelstore-paperless-backup_duplicati_1
      APP_PORT: 8200
      PROXY_AUTH_ADD: "false"

  # 1) DB-Dump: Paperless-PostgreSQL taeglich 01:30 (Europe/Berlin)
  #    in die App-Daten (db-export, 7 Tagesversionen, atomar).
  dbdump:
    image: docker.io/library/postgres:16
    restart: unless-stopped
    environment:
      TZ: Europe/Berlin
      PGHOST: paperless_db_1
      PGPORT: "5432"
      PGUSER: paperless
      PGPASSWORD: paperless
      PGDATABASE: paperless
    volumes:
      - ${APP_DATA_DIR}/data/db-export:/out
    command:
      - /bin/bash
      - -c
      - |
        set -euo pipefail
        while :; do
          ts=$$(date +%F)
          echo "[dbdump] pg_dump $$PGDATABASE ($$PGUSER@$$PGHOST) -> /out/paperless-$$ts.sql.gz"
          pg_dump | gzip > "/out/paperless-$$ts.sql.gz.part" && mv "/out/paperless-$$ts.sql.gz.part" "/out/paperless-$$ts.sql.gz"
          find /out -name 'paperless-*.sql.gz' -mtime +7 -delete
          target=$$(date -d "tomorrow 01:30" +%s)
          now=$$(date +%s)
          echo "[dbdump] naechster Lauf: $$(date -d @$$target)"
          sleep $$((target - now))
        done

  # 2) Duplicati: offizielles Container-Image (identischer Digest wie in der
  #    offiziellen Umbrel-App). Sichert media + db-export per SFTP
  #    (Port 22, Passwort-Auth, keine SSH-Keys) auf die Storage Box.
  duplicati:
    image: duplicati/duplicati:2.4.0.1@sha256:e32e280cc30e98ac5cea8d2b339cd19810b1b39e638fb9d39253786630104de0
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 1m
    volumes:
      - ${APP_DATA_DIR}/data:/data
      # Sicherungsgueter, nur lesend (Restore bewusst nach /data/restore)
      - ${UMBREL_ROOT}/app-data/paperless/data/media:/mnt/source/media:ro
      - ${APP_DATA_DIR}/data/db-export:/mnt/source/db-export:ro
    environment:
      DUPLICATI__WEBSERVICE_PORT: "8200"
      DUPLICATI__WEBSERVICE_INTERFACE: "any"
      DUPLICATI__WEBSERVICE_PASSWORD: "${APP_PASSWORD}"
      DUPLICATI__WEBSERVICE_ALLOWED_HOSTNAMES: "*"
      TZ: Europe/Berlin
