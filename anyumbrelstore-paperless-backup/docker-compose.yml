version: "3.7"

services:
  # 1) DB-Dump: Paperless-PostgreSQL taeglich 01:30 (Europe/Berlin)
  #    in die App-Daten (db-export, 7 Tagesversionen, atomar).
  dbdump:
    image: docker.io/library/postgres:16
    restart: unless-stopped
    environment:
      TZ: Europe/Berlin
      PGHOST: paperless_db_1
      PGPORT: "5432"
      PGUSER: paperless
      PGPASSWORD: paperless
      PGDATABASE: paperless
    volumes:
      - ${APP_DATA_DIR}/data/db-export:/out
    command:
      - /bin/bash
      - -c
      - |
        set -euo pipefail
        while :; do
          ts=$$(date +%F)
          echo "[dbdump] pg_dump $$PGDATABASE ($$PGUSER@$$PGHOST) -> /out/paperless-$$ts.sql.gz"
          pg_dump | gzip > "/out/paperless-$$ts.sql.gz.part" && mv "/out/paperless-$$ts.sql.gz.part" "/out/paperless-$$ts.sql.gz"
          find /out -name 'paperless-*.sql.gz' -mtime +7 -delete
          target=$$(date -d "tomorrow 01:30" +%s)
          now=$$(date +%s)
          echo "[dbdump] naechster Lauf: $$(date -d @$$target)"
          sleep $$((target - now))
        done

  # 2) Borgmatic: media + db-export taeglich 02:30 in das Borg-Repo
  backup:
    # Borgmatic-Collective-Image: Borg + Borgmatic + crond (S6).
    # SemVer-Tag mit Digest-Pin; Renovate aktualisiert Version + Digest.
    image: ghcr.io/borgmatic-collective/borgmatic:2.1.10@sha256:25a97d84a2371c385c0031a02b64f7167de85631a85b84ef46dc01a80010d19e
    restart: unless-stopped
    stop_grace_period: 30m
    environment:
      TZ: Europe/Berlin
      CRON: "30 2 * * *"
      CRON_COMMAND: "borgmatic-start --stats -v 1 2>&1"
      BORG_PASSPHRASE_FILE: /config/borg-passphrase
    volumes:
      # Sicherungsgueter, nur lesend (Restore bewusst ueber /config/restore)
      - ${UMBREL_ROOT}/app-data/paperless/data:/mnt/source:ro
      # Persistente Konfiguration + Secrets: in den App-Daten, nie im Repo
      - ${APP_DATA_DIR}/data:/config
      - ${APP_DATA_DIR}/data/borgmatic.d:/etc/borgmatic.d
      - ${APP_DATA_DIR}/data/ssh:/root/.ssh
      - ${APP_DATA_DIR}/data/borg-config:/root/.config/borg
      - ${APP_DATA_DIR}/data/borg-cache:/root/.cache/borg
      - ${APP_DATA_DIR}/data/borgmatic-state:/root/.local/state/borgmatic
