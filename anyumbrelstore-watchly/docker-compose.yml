services:
  app_proxy:
    environment:
      APP_HOST: anyumbrelstore-watchly_server_1
      APP_PORT: 8000
      # Nuvio und Browser im LAN rufen Manifest und Config-Seite ohne
      # Umbrel-Login-Cookies auf; Watchly hat ein eigenes Kontosystem.
      PROXY_AUTH_ADD: "false"

  server:
    image: ghcr.io/timilsinabimal/watchly:1.18.0
    restart: on-failure
    # Start-Race-Fix (Vorfall 12./13.11.2026): Startet der server-Container
    # gleichzeitig mit oder vor Redis, kann der Uvicorn-Worker Redis
    # "verlieren". Upstream-Bug: redis_service.get() schluckt JEDE
    # Redis-Stoerung und gibt None zurueck (nicht vom "Key fehlt"
    # unterscheidbar) -> /tokens/identity liefert exists=false trotz
    # intakter Konten, der Login will neue Konten anlegen. Watchly erst
    # starten, wenn Redis PING beantwortet (compose-v2-Condition).
    depends_on:
      redis:
        condition: service_healthy
    environment:
      # Redis-DNS-Split-Brain-Fix (Vorfall 24.11.2026): Umbrel betreibt
      # alle Apps im selben Docker-Netz; Docker-DNS kann den bare
      # Service-Namen redis je Worker auf die Redis-Instanz einer ANDEREN
      # App aufloesen (getent hosts redis lieferte hier zwei IPs:
      # watchly_redis_1 und aiometadata_redis_1). Reads/Writes verteilen
      # sich dann auf beide Instanzen, Token/Identity landen scheinbar
      # verloren in der falschen Redis. Redis deshalb immer ueber den
      # eigenen Container-Namen adressieren (gleiche Konvention wie
      # APP_HOST), nie als bare Service-Name.
      REDIS_URL: redis://anyumbrelstore-watchly_redis_1:6379/0
      APP_ENV: production
      # Salt fuer Addon-Token, instance-spezifisch generiert
      TOKEN_SALT: "173fe049837c618f5b26f8c9fd98e9fc7230929b421a8405f2dcd0c8cee73e07"
      # Addon-Basis-URL, wie Nuvio sie erreicht
      HOST_NAME: http://umbrel.internal:30127
      ALLOW_SIGNUPS: "True"
      # Selbst gehostetes Nuvio-Backend, seit Upstream 1.18.0 nativ
      # unterstuetzt via NUVIO_BASE_URL/NUVIO_PUBLISHABLE_KEY (Unset =
      # Nuvio-Cloud). Beide Variablen bewusst NICHT im Manifest, sondern
      # als App-Env-Variablen in den Umbrel-App-Einstellungen gesetzt:
      # Jeder Betreiber adressiert sein eigenes Backend, und beide muessen
      # dasselbe adressieren (der Server liest die Historie und installiert
      # das Addon, der Browser baut die Session beim Connect-Nuvio-Login).
      # Den Publishable-Key des Backends zeigt
      # <NUVIO_BASE_URL>/.well-known/nuvio; eine Auto-Discovery gibt es
      # im Upstream 1.18.0 nicht.
      # TMDB_API_KEY (Upstream-Bug: Web-UI-Key wird von mehreren Code-Pfaden
      # ignoriert) weiterhin als App-Env bzw. nach jedem App-Update in der
      # gerenderten Compose setzen (Umbrel rendert bei Updates neu).
    healthcheck:
      test: ["CMD", "curl", "-fsSL", "http://localhost:8000/"]
      interval: 30s
      retries: 3
      start_period: 30s

  redis:
    image: redis:8-alpine
    restart: on-failure
    # Start-Race-Fix: Healthcheck als depends_on-Bedingung fuer server
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - ${APP_DATA_DIR}/data/redis:/data
