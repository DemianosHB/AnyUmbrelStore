manifestVersion: "1"
id: anyumbrelstore-watchly
storage:
  dataRoot: data
category: media
name: Watchly
# Fork-Release: Version und Image werden manuell gebumpt (Renovate ist
# fuer das Fork-Image deaktiviert); Rueckkehr zum Upstream-Image, sobald
# die Fork-PRs (u. a. #225) gemergt sind.
version: "1.18.1-Demianos2"
tagline: Personalisierte Empfehlungen aus deiner selbst gehosteten Nuvio-Historie
description: >-
  Watchly baut aus deiner Watch-Historie personalisierte Empfehlungs-Reihen
  ("Top Picks for You", "Because you watched ...", Genre- und Keyword-Kataloge)
  und blendet sie als Katalog-Addon in Nuvio ein. Mit NUVIO_BASE_URL und
  NUVIO_PUBLISHABLE_KEY (Umbrel-App-Env) liest sie die Historie direkt aus
  dem selbst gehosteten Nuvio-Backend, ohne Umweg über Trakt, Simkl oder
  die Nuvio-Cloud; ohne beide Variablen läuft Watchly gegen die Nuvio-Cloud.


  Erste Schritte: NUVIO_BASE_URL (Kong-API des eigenen Nuvio-Backends) und
  NUVIO_PUBLISHABLE_KEY (dessen Publishable-Key, sichtbar unter
  /.well-known/nuvio) als Env-Variablen in den Umbrel-App-Einstellungen
  setzen, Weboberfläche öffnen (umbrel.local:30127), Konto anlegen und
  TMDB-API-Key als TMDB_API_KEY-Env-Variable hinterlegen (kostenlos auf
  themoviedb.org, API Key v3; mehrere Watchly-
  Code-Pfade ignorieren den in der Web-UI gesetzten Key, ohne die Env-
  Variable schlägt das Manifest mit Fehler 500 fehl), unter Accounts Nuvio
  verbinden (Anmeldung direkt am eigenen Backend), gewünschte Kataloge
  auswählen und speichern. Den angezeigten Installations-Link danach in der
  Nuvio-App unter Einstellungen -> Addons einfügen; die Empfehlungs-Reihen
  erscheinen auf dem Nuvio-Homescreen.


  Technik: Fork-Image (ghcr.io/demianoshb/watchly, gebaut aus
  DemianosHB/Watchly Branch release/all-features) mit den noch nicht
  gemergten Fork-Features; nach Upstream-Merge Rueckkehr zum offiziellen
  Upstream-Image moeglich. Watchly unterstützt self-hosted
  Nuvio-Backends seit Upstream 1.18.0 nativ über NUVIO_BASE_URL und
  NUVIO_PUBLISHABLE_KEY (ohne Set = Nuvio-Cloud); beide Variablen werden
  bewusst nicht im Manifest vorgegeben, sondern als Env-Variablen in den
  Umbrel-App-Einstellungen gesetzt: NUVIO_BASE_URL zeigt auf das eigene
  Backend (Kong-API, Port 30123), NUVIO_PUBLISHABLE_KEY auf dessen
  Publishable-Key (sichtbar unter /.well-known/nuvio) - eine Auto-Discovery
  gibt es im Upstream nicht. Der Nuvio-Login im Browser läuft dann direkt
  gegen das eigene Backend, nicht gegen die Cloud.


  Hinweis: Ohne Umbrel-Login im lokalen Netz erreichbar (Nuvio und Browser
  rufen Manifest und Kataloge ohne Umbrel-Cookies auf); Watchly ist über sein
  eigenes Kontosystem geschützt. Nur im lokalen Netz bzw. hinter einem VPN
  betreiben.
releaseNotes: >-
  1.18.1-Demianos2 - Scrob-Fix: Watchly ruft die Scrob-API jetzt
  ueber den dokumentierten /api/proxy-Pfad des Scrob-Web-Frontends
  auf (der FastAPI-Backend-Port ist localhost-only). Vorher
  landeten die Abrufe auf der Login-HTML-Seite (Status 200), die
  Scrob-Historie blieb leer und die Reihen fielen auf Trending
  zurueck. Der Verbindungs-Test beim Speichern validiert zudem,
  dass wirklich JSON zurueckkommt - falsche Base-URLs fallen jetzt
  beim Speichern auf, statt die Library stumm leer zu lassen.
  Nach dem App-Update in Watchly /configure einmal neu speichern,
  damit der Resync mit korrekten Pfaden laeuft.
  1.18.1-Demianos1 - Fork-Release: Eigenes Watchly-Image
  (ghcr.io/demianoshb/watchly) aus DemianosHB/Watchly, Branch
  release/all-features, statt des offiziellen Upstream-Images, damit
  die noch nicht gemergten Fork-Features sofort nutzbar sind. Enthaelt:
  Self-hosted Scrob als zusaetzliche Watch-History-Quelle
  (vibe/scrob-history-source), Digital-Release-Filter fuer Film-Reihen
  (feat/digital-release-filter, Upstream-Issue #80 / PR #225),
  LLM-gestuetzte Titel-Auswahl pro Katalog-Reihe (poc/llm-row-selection,
  Opt-in, nur mit eigenem LLM-Key), Surface Redis-Write-Failures
  (fix/surface-redis-write-failures) und Nuvio-Daily-Library-Refetch
  (fix/nuvio-daily-library-refetch). Merge-Konfliktloesungen im
  _build_catalog: beide Overfetch-Faktoren stapeln, Home-Release-Filter
  vor der LLM-Auswahl; die Auswahl ist fail-open, Reihen werden durch
  LLM-Fehler nie kuerzer oder leer.
  Renovate ist fuer das Fork-Image deaktiviert, Fork-Releases werden
  manuell gebumpt. Sobald die PRs upstream gemergt sind, kann der
  Store zurueck auf das Upstream-Image wechseln.
  1.18.0+pkg2 - Packaging-Fix fuer den Redis-DNS-Split-Brain: REDIS_URL
  adressiert Redis jetzt ueber den eigenen Container-Namen
  (anyumbrelstore-watchly_redis_1) statt des bare Service-Namens redis.
  Docker-DNS kann bare Namen im gemeinsamen Umbrel-Netz je Worker auf
  die Redis-Instanz einer anderen App aufloesen (hier: AIOMetadata),
  Reads/Writes verteilen sich auf beide Instanzen und Token/Identity
  landen scheinbar verloren in der falschen Redis. Ergaenzt den
  Start-Race-Fix aus +pkg1 - der Boot-Race war nur eine Teil-Ursache,
  das Symptom trat auch zur Laufzeit ohne Restart auf. Keine Aenderung
  am Watchly-Image, Upstream bleibt 1.18.0.

  1.18.0+pkg1 - Packaging-Fix fuer den Redis-Start-Race: Der
  server-Container startet erst, wenn Redis PING beantwortet (depends_on
  mit service_healthy-Bedingung plus neuer redis-cli-Healthcheck). Behebt
  das intermittierende Login-Symptom nach Container-Restarts, bei dem
  Watchly bestehende Konten nicht erkennt (Login will neue Konten
  anlegen, obwohl die Konten in Redis intakt sind). Keine Aenderung am
  Watchly-Image, Upstream bleibt 1.18.0.
  1.18.0 - Umstellung auf das offizielle Upstream-Image
  (ghcr.io/timilsinabimal/watchly): Watchly 1.18.0 unterstützt self-hosted
  Nuvio-Backends nativ über NUVIO_BASE_URL/NUVIO_PUBLISHABLE_KEY
  (Upstream-PR #206). Eigenes Store-Image samt Image-Build (docker/watchly,
  Watchly Docker Image Workflow, WATCHLY_REF) eingezogen; Renovate
  aktualisiert Manifest-Version und Image-Tag jetzt direkt wie bei den
  anderen Apps. NUVIO_BASE_URL und NUVIO_PUBLISHABLE_KEY werden bewusst
  nicht mehr im Manifest gesetzt, sondern als Umbrel-App-Env durch den
  Betreiber (keine Auto-Discovery); TMDB_API_KEY weiterhin nach jedem
  App-Update prüfen (Umbrel rendert die App-Compose neu). Neue Upstream-Features:
  Combined-Katalog-Reihe für Filme und Serien, italienische Katalog-Namen,
  KI-Katalogtitel direkt in der Anzeigesprache.
  8-alpine - Update des Docker-Images auf 8-alpine. Keine automatisierten Release-Notes
  abrufbar – Details: https://github.com/docker-library/redis/releases.
  1.17.2 - Erste Packaging-Version: Watchly 1.17.2 als eigenes Multi-Arch-
  Image (ghcr.io/demianoshb/watchly, amd64+arm64), gebaut aus dem unveränderten
  Upstream-Source mit Start-Skript-Patch für self-hosted Nuvio-Backends
  (NUVIO_BASE_URL/NUVIO_PUBLISHABLE_KEY per Env, Publishable-Key automatisch
  per Discovery-Endpunkt). Port 30127, Redis-State in den App-Daten
  persistiert, Healthcheck auf /. Image-Build im Store-Repo unter
  docker/watchly (Workflow: Watchly Docker Image).
developer: TimilsinaBimal
