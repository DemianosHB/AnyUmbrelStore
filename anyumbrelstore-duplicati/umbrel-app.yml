manifestVersion: "1"
id: anyumbrelstore-duplicati
storage:
  dataRoot: data
category: files
name: Duplicati
version: "2.4.0.1"
tagline: Verschluesseltes Backup des Heimnetzes auf die Hetzner Storage Box
description: >-
  Duplicati als eigene Store-Version mit persistenten Mounts fuer das
  Paperless-Backup. Die Paperless-App-Daten (Dokumente unter media und
  SQL-Dumps unter db-export) sind dauerhaft als /paperless-data im
  Container verfuegbar und gehen bei App-Updates nicht verloren.
  Optional kann per Ordner-Zugriff ein zusaetzlicher Speicherordner
  aus der umbrelOS-Dateiverwaltung (nur lesend) eingebunden werden.
developer: Duplicati
website: https://duplicati.com
dependencies: []
repo: https://github.com/duplicati/duplicati
support: https://forum.duplicati.com
releaseNotes: Store-Fork mit persistenter Paperless-Anbindung (media und db-export), Option für Ordner-Zugriff auf verwaltete Speicherordner.
port: 8200
gallery: []
path: ""
defaultUsername: ""
deterministicPassword: true
submitter: anyumbrelstore
submission: https://github.com/DemianosHB/AnyUmbrelStore/
icon: https://raw.githubusercontent.com/DemianosHB/AnyUmbrelStore/master/anyumbrelstore-duplicati/icon.svg
folderAccess:
  - id: extra-folder
    name: Zusaetzlicher Backup-Ordner (optional)
    note: Optionaler weiterer Ordner aus der umbrelOS-Dateiverwaltung, z. B. Photos oder Documents. Wird nur lesend eingebunden.
    mounts:
      - service: duplicati
        targetPath: /extra
        readOnly: true
